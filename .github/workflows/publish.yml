name: Build and publish Workbench image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Test image
        run: docker buildx build --file Containerfile --load --target test --tag nro-workbench:test .

      - name: Build release image
        run: docker buildx build --file Containerfile --load --target release --tag nro-workbench:release .

      - name: Build and test the Apptainer image
        shell: bash
        run: |
          curl --fail --location --output /tmp/apptainer.deb \
            https://github.com/apptainer/apptainer/releases/download/v1.4.5/apptainer_1.4.5_amd64.deb
          sudo apt-get update
          sudo apt-get install --yes /tmp/apptainer.deb xvfb
          apptainer build nro-workbench.sif docker-daemon://nro-workbench:release
          apptainer exec nro-workbench.sif wb_command -version
          set +e
          timeout 8s xvfb-run -a apptainer exec nro-workbench.sif wb_view \
            >/tmp/wb-view.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 124 ]]; then
            cat /tmp/wb-view.log
            exit 1
          fi
          sha256sum nro-workbench.sif > nro-workbench.sif.sha256

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tags
        id: image
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          {
            echo "repository=$repository"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: release
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Publish the Apptainer release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            nro-workbench.sif nro-workbench.sif.sha256 \
            --title "nro Workbench ${GITHUB_REF_NAME#v}" \
            --notes "Self-contained Connectome Workbench 2.2.1 runtime for nro. The image passed command-line and X11 GUI smoke tests before publication."
